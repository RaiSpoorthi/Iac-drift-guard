name: DriftGuard pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *" # daily drift check at 09:00 IST

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  TF_VERSION: "1.9.8"
  CONFTEST_VERSION: "0.56.0"
  # Dummy credentials for the local emulator. Real AWS is never contacted.
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: pytest -q

      - name: IaC misconfiguration scan (Checkov)
        run: |
          pip install checkov
          checkov -d terraform --framework terraform --compact --quiet

      - name: Install conftest
        run: |
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" | tar -xz conftest
          sudo mv conftest /usr/local/bin/conftest

      - name: Policy unit tests (OPA/Rego)
        run: conftest verify --policy policies

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt and validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  drift-e2e:
    name: Drift detection end-to-end
    needs: static-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install conftest
        run: |
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" | tar -xz conftest
          sudo mv conftest /usr/local/bin/conftest

      - name: Start local AWS emulator (Moto)
        run: |
          nohup moto_server -H 127.0.0.1 -p 5000 > moto.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/moto-api/ > /dev/null; then echo "Moto is up"; exit 0; fi
            sleep 1
          done
          echo "Moto did not start"; cat moto.log; exit 1

      - name: Policy gate on the Terraform plan (OPA/conftest)
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan > plan.json
          conftest test plan.json --policy ../policies

      - name: Deploy, simulate drift, detect, remediate, verify
        run: python -m driftguard run

      - name: Publish report to job summary
        if: always()
        run: |
          if [ -f reports/drift-report.md ]; then
            cat reports/drift-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: |
            reports/
            moto.log
          if-no-files-found: warn
